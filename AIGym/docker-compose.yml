services:
  # Spring Boot Application
  backend:
    build: .
    container_name: aigym-backend
    ports:
      - "8080:8080"
    environment:
      # Ghi đè cấu hình kết nối DB bằng biến môi trường (Environment variables)
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/aigym?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/aigym
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aigym-network

  # MySQL Database
  mysql:
    image: mirror.gcr.io/library/mysql:8.0
    container_name: aigym-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=aigym
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aigym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database (Dựa trên pom.xml có dùng MongoDB)
  mongodb:
    image: mirror.gcr.io/library/mongo:latest
    container_name: aigym-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=aigym
    volumes:
      - mongodb_data:/data/db
    networks:
      - aigym-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aigym-network:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
