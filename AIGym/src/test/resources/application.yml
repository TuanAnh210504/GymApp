spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.dummy.com
    port: 587
    username: test
    password: test

jwt:
  secret: aigym-test-secret-key-must-be-at-least-256-bits-long
  issuer: aigym
  accessExpiration: 86400000
  refreshExpiration: 604800000

gemini:
  api:
    key: "dummy-test-key"
