name: Backend CI/CD

on:
  push:
    branches:
      - dev
    paths:
      - 'AIGym/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'AIGym/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./AIGym

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean verify
